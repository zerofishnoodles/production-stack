servingEngineSpec:
  vllmApiKey: "fake_key"
  runtimeClassName: ""
  modelSpec:
  - name: "opt125m"
    repository: "lmcache/vllm-openai"
    tag: "2025-05-27-v1"
    modelURL: "facebook/opt-125m"
    replicaCount: 2
    requestCPU: 8
    requestMemory: "30Gi"
    requestGPU: 1
    pvcStorage: "50Gi"
    vllmConfig:
      enablePrefixCaching: true
      maxModelLen: 1024
      v1: 1
      gpuMemoryUtilization: 0.6

routerSpec:
  repository: "git-act-router"  # Use the image we just built
  imagePullPolicy: "IfNotPresent"
  strategy:
    type: Recreate
  enableRouter: true
  routingLogic: "roundrobin"
  serviceType: "LoadBalancer"
  extraArgs:
    - "--log-level"
    - "debug"
